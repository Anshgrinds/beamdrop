[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beamdrop"
version = "1.0.0"
description = "⚡ Zero-config, blazing-fast local file and clipboard transfer between PC & Mobile across Wi-Fi. Zero dependencies."
readme = "README.md"
authors = [{ name = "Anshgrinds", email = "retired1234321@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: File Sharing",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Utilities"
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
app = ["pywebview>=5.0.0"]

[project.scripts]
beamdrop = "beamdrop.__main__:main"
beamdrop-app = "app:run_desktop_app"

[tool.setuptools.package-data]
"beamdrop" = ["web/*"]
